<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0,
    maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
  >

  <meta name="theme-color" content="#f7f7f7">

  <title>Dino Run</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="wrap">

    <header class="hud">

      <div class="hint" id="startHint">
        SPACE / ↑ TO JUMP • ↓ TO DUCK
      </div>

      <div class="scores">

        <span>
          HI <b id="hiScore">00000</b>
        </span>

        <span>
          SC <b id="score">00000</b>
        </span>

      </div>

    </header>

    <section
      class="game-shell"
      aria-label="Dino endless runner"
    >

      <canvas id="gameCanvas"></canvas>

      <div id="gameOver" class="game-over hidden">

        <div class="game-over-title">
          GAME OVER
        </div>

        <div class="game-over-score">
          SCORE
          <b id="finalScore">00000</b>
        </div>

        <button id="restartBtn" type="button">
          ↻ RESTART
        </button>

      </div>

    </section>

    <div
      id="mobileControls"
      class="mobile-controls"
      aria-label="Touch controls"
    >

      <button
        id="mobileDuckBtn"
        class="mobile-control duck-control"
        type="button"
        aria-label="Hold to duck"
      >
        ⬇ DUCK
      </button>

      <button
        id="mobileJumpBtn"
        class="mobile-control jump-control"
        type="button"
        aria-label="Jump"
      >
        ⬆ JUMP
      </button>

    </div>

  </main>

  <script src="game.js"></script>

</body>
</html>
